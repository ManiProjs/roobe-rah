[package]
name = "rah-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rah"
path = "src/main.rs"

[dependencies]

rah-core = { path = "../rah-core" }
rah-config = { path = "../rah-config" }
toml = "1.1.5"
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
dirs = "6.0.0"
tokio = { version = "1.53.1", features = ["full"] }
indicatif = "0.18.6"
console = "0.16.4"
futures = "0.3.34"

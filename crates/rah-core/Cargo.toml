[package]
name = "rah-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
dirs = "6.0.0"
flate2 = "1.1.10"
indicatif = "0.18.6"
rah-config = { path = "../rah-config" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
zip = "8.6.0"
